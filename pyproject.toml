[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bahulam-two-agent-ide-poc"
version = "0.1.0"
description = "A small Bahulam-style two-agent coding POC using the A2A protocol."
requires-python = ">=3.10"
dependencies = [
  "a2a-sdk[http-server]==1.3.1",
  "uvicorn>=0.30,<1",
  "google-genai>=1.0",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["bahulam_poc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["workspaces", ".venv", "state", ".git"]
